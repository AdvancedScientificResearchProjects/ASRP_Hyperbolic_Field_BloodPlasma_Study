<title id="t">Analysis pipeline</title>
<desc id="d">Flow chart. Raw images, then preprocessing, which splits into stage 1 CV analysis (SAM-2, SigLIP2, DINOv2) and stage 2 LLM vision (Claude Opus 4.6). Both feed stage 3 comparative cross-validation, then stage 4 statistical (ANOVA, t-tests, p-values), then final reports.</desc>
