<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="t d">
<title id="t">Структура программы исследований</title>
<desc id="d">Дерево. Программа исследований гиперболических полей ASRP 2026-2027 имеет четыре ветви. Исследование кровяной плазмы: анализ свёртываемости, покадровая съёмка (в планах), биохимический анализ (нет в репо). Исследование кристаллов DAAT: взаимодействие человек-кристалл. Сельскохозяйственное исследование: рост растений, выращивание грибов. Программы излучателей: ПО управления, ИИ-алгоритмы.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='650' rx='18' fill='url(#bg)'/>

