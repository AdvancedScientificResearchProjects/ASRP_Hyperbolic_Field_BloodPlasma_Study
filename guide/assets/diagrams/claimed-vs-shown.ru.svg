<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 826" width="1200" height="826" role="img" aria-labelledby="t d">
<title id="t">Что заявлено и что показывает репозиторий</title>
<desc id="d">Шесть строк слева направо: тема, что говорят тексты, что показывают данные и код, слово-состояние. Эффект на свёртывание: README пишет, что гипотеза подтверждена; отчёты называют лучший результат CV наводящим, но неубедительным, p 0.1462 (частично). Значимость: README называет p = 0.027 значимым; один прогон из 19 вердиктов, точное одностороннее p 0.024, позиция смешана с каналом (слабо). Число сгустков: -37 и -42 процента в README; у CV-детектора за ними более 95 процентов ложных срабатываний по собственному отчёту репозитория (отвергнуто). Биохимия: фибриноген r = 0.72 заявлен, данных нет (нет в репо). Патент: README пишет, что технология защищена; это заявка (только заявлено). Статья: планировалась на апрель-май 2026, рукописи нет (в планах).</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='826' rx='18' fill='url(#bg)'/>

