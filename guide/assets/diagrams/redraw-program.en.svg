<title id="t">Research programme structure</title>
<desc id="d">Tree. ASRP Hyperbolic Field Research Program 2026-2027 has four branches. Blood Plasma Study: coagulation analysis, time-lapse imaging (planned), biochemical analysis (not in repo). DAAT Crystal Study: human-crystal interaction. Agricultural Study: plant growth, fungi cultivation. Emitter Programs: control software, AI algorithms.</desc>
