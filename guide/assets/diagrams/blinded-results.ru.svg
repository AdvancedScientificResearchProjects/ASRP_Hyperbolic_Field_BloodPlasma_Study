<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-labelledby="t d">
<title id="t">Слепое сравнение: как часто выбирали канал 19</title>
<desc id="d">Горизонтальные столбцы: доля слепых вердиктов, назвавших канал 19 самым свёрнутым образцом, и линия случайности 33.3 процента. Gemini 57.9 процента из 19 вердиктов, один прогон (выше случайности, один прогон). Perplexity 36.4 из 33, Groq 33.3 из 57, GPT-5 23.6 из 55 (на уровне случайности или ниже). Числа пересчитаны по сырым файлам результатов.</desc>
