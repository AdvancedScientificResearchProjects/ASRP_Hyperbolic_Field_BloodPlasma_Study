<title id="t">Дорожная карта программы</title>
<desc id="d">Семь блоков со стрелками: 24-31 янв сбор данных; 1-7 фев доноры P06 и P07; 25-26 фев анализ ИИ/LLM; 12-14 мар сравнительный анализ; 18-26 мар задачи и репозиторий; апр-май рецензирование и публикация (в планах); в будущем 30 доноров (в планах).</desc>
