<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d">
<title id="t">Ход протокола по плазме крови</title>
<desc id="d">Одиннадцать шагов по порядку: набор доноров, забор крови, разделение плазмы, подготовка триплетов, воздействие гиперболического поля, покадровая съёмка (в планах), анализ свёртываемости, биохимические маркеры (нет в репо), анализ LLM/CV, статистика, финальный отчёт.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='500' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>Ход протокола по плазме крови</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>Задача 3 (папка-зеркало)</text>
<text x='1176' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#4ecdc4' text-anchor='end' font-weight='700' letter-spacing='2'>ПЕРЕРИСОВАННАЯ СХЕМА</text>
<rect x='24' y='96' width='250' height='96' rx='12' fill='#0b1430' stroke='#ffcf5c' stroke-width='1.6'/>
<text x='149.0' y='152.0' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='15' fill='#e6ecff' text-anchor='middle' font-weight='700'>1. Набор доноров</text>
<rect x='324' y='96' width='250' height='96' rx='12' fill='#0b1430' stroke='#4ecdc4' stroke-width='1.6'/>
