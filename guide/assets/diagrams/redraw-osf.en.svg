<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">OSF preregistration structure</title>
<desc id="d">Tree. OSF preregistration has four branches. Primary hypothesis H1: hyperbolic field exposure produces measurable changes. Sampling plan: 5-10 donors, 30-60 plasma samples. Analysis plan: ANOVA with post-hoc analysis, p below .05 significance. Variables: clot formation time and clot degradation rate, both never measured in the repository.</desc>
