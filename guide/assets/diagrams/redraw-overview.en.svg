<title id="t">Research overview</title>
<desc id="d">Flow chart. Blood donors, 7 patients, then plasma separation, then hyperbolic field exposure, which branches into four: time-lapse photography, channel 19 (time acceleration, claimed only), channel 21 (time deceleration, claimed only) and control (no exposure). Photography continues to AI/ML analysis, statistical analysis and scientific reports.</desc>
