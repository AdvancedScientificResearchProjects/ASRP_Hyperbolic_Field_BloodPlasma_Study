<title id="t">Связь исследования с патентной заявкой</title>
<desc id="d">Блок-схема. KZ 2025/1095.1, Фрактальная БСГП, 14 марта 2025 (заявка, не выданный патент), защищает (заявлено) излучатели гиперболических полей, которые используются в трёх исследованиях: исследование кровяной плазмы, исследование кристаллов DAAT и сельскохозяйственное исследование.</desc>
