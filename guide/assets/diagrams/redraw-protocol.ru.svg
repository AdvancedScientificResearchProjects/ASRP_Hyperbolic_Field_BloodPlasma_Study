<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" width="1200" height="1060" role="img" aria-labelledby="t d">
<title id="t">Протокол эксперимента</title>
<desc id="d">Блок-схема. Забор крови, 4 пробирки на донора; центрифугирование, 2000 об/мин 5 минут; отбор плазмы, перераспределение по образцам; облучение, около 1 часа 12 минут, которое делится на фотографирование (до, во время, после), канал 19 ускорение, канал 21 замедление и контроль без воздействия. Съёмка продолжается анализом ИИ/МЛ (несколько провайдеров), статистикой (ANOVA, t-тесты) и отчётами (научные статьи). Протокольные документы репозитория расходятся по времени облучения, типу пробирок и режиму центрифугирования.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='1060' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>Протокол эксперимента</text>
