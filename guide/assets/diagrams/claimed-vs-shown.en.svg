<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 826" width="1200" height="826" role="img" aria-labelledby="t d">
<title id="t">What is claimed and what the repository shows</title>
<desc id="d">Six rows, left to right: topic, what the texts say, what the data and code show, and a state word. Effect on clotting: README says hypothesis validated; reports call the best CV result suggestive but inconclusive, p 0.1462 (partly). Significance: README lists p = 0.027 as significant; one run of 19 verdicts, exact one-sided p 0.024, position confounded with channel (weak). Clot counts: -37 and -42 percent in the README; the CV detector behind them has over 95 percent false positives per the repo's own report (rejected). Biochemistry: fibrinogen r = 0.72 reported, no data (not in repo). Patent: README says technology protected; it is an application (claimed only). Publication: planned April-May 2026, no manuscript (planned).</desc>
