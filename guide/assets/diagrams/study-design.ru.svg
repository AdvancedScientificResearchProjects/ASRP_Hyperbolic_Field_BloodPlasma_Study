<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">Как устроен пилот</title>
<desc id="d">Поток слева направо. 7 доноров дают плазму. Плазма каждого донора делится на три условия: контроль без воздействия, канал 19 (метка: ускорение времени) и канал 21 (метка: замедление времени); экспозиция около часа. Пробирки фотографируют телефоном на светодиодной панели: 101 фотографий. Фотографии оценивают три вида читателей: классическое компьютерное зрение, модели зрения и zero-shot, и LLM-провайдеры с видением, вслепую и без слепоты (10 слепых прогонов, 4 провайдера). Измерений времени свёртывания и биохимии в репозитории нет.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='560' rx='18' fill='url(#bg)'/>

<text x='24' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='26' fill='#e6ecff' text-anchor='start' font-weight='700'>Как устроен пилот</text>
<text x='24' y='72' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#8ea0d6' text-anchor='start' font-weight='400'>Слева направо: образцы, фотографии, читатели</text>
<text x='1176' y='46' font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size='14' fill='#4ecdc4' text-anchor='end' font-weight='700' letter-spacing='2'>ДИЗАЙН ИССЛЕДОВАНИЯ</text>
<rect x='24' y='150' width='250' height='170' rx='12' fill='#0b1430' stroke='#ffcf5c' stroke-width='1.6'/>
