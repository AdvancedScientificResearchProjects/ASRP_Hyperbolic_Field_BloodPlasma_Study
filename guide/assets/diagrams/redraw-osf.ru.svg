<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">Структура предварительной регистрации OSF</title>
<desc id="d">Дерево. Предварительная регистрация OSF имеет четыре ветви. Основная гипотеза H1: воздействие гиперболического поля вызывает измеримые изменения. План выборки: 5-10 доноров, 30-60 образцов плазмы. План анализа: ANOVA с пост-хок анализом, значимость p &lt; .05. Переменные: время образования сгустка и скорость деградации сгустка, оба не измерялись в репозитории.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='560' rx='18' fill='url(#bg)'/>

