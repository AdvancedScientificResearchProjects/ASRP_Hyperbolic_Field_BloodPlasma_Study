<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1060" width="1200" height="1060" role="img" aria-labelledby="t d">
<title id="t">Experimental protocol</title>
<desc id="d">Flow chart. Blood collection, 4 tubes per donor; centrifugation, 2000 RPM for 5 minutes; plasma separation, redistribute to samples; irradiation, about 1 hour 12 minutes, which branches into photography (before, during, after), channel 19 acceleration, channel 21 deceleration and control with no exposure. Photography continues to AI/ML analysis (multi-provider), statistics (ANOVA, t-tests) and reports (scientific papers). The protocol documents of the repository disagree on exposure time, tube type and centrifugation settings.</desc>
