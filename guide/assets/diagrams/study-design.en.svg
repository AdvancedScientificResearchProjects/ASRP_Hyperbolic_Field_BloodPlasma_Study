<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
<title id="t">How the pilot is built</title>
<desc id="d">Flow from left to right. 7 donors give plasma. Each donor's plasma is split into three conditions: untreated control, channel 19 (labelled time acceleration) and channel 21 (labelled time deceleration), exposed for roughly an hour. The tubes are photographed with a phone on an LED panel, giving 101 photographs. Three kinds of reader score the photographs: classical computer vision, computer-vision and zero-shot models, and LLM vision providers, run unblinded and blinded (10 blinded runs by 4 providers). No clotting-time or biochemical measurement exists in the repository.</desc>
<defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#070b18'/><stop offset='1' stop-color='#0d1530'/></linearGradient><filter id='glow' x='-50%' y='-50%' width='200%' height='200%'><feGaussianBlur stdDeviation='3' result='b'/><feMerge><feMergeNode in='b'/><feMergeNode in='SourceGraphic'/></feMerge></filter></defs>
<rect width='1200' height='560' rx='18' fill='url(#bg)'/>

